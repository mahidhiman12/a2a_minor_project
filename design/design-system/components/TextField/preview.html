<div class="ns-row" style="align-items:flex-start;gap:28px">

<div class="ns-field"><label>Description</label><div class="ns-input is-focus"><input value="Water flowing on the road since 7 am"></div></div>
</div>
<div class="ns-stack" style="width:340px;gap:18px">

<div class="ns-input pill"><svg class="ns-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Search complaints"></div>
</div></div>
