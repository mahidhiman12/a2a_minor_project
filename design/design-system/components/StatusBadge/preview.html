<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div class="ns-stack" style="gap:16px">
<div class="ns-row" style="gap:22px"><span class="ns-status pending">Registered</span><span class="ns-status active">In progress</span><span class="ns-status done">Resolved</span><span class="ns-status error">Not routed</span><span class="ns-status idle">Not involved</span></div>
<div class="ns-row" style="gap:8px"><span class="ns-badge pending ns-mono">submitted</span><span class="ns-badge active ns-mono">working</span><span class="ns-badge pending ns-mono">input-required</span><span class="ns-badge done ns-mono">completed</span><span class="ns-badge error ns-mono">rejected</span></div>
</div>
</body>
</html>
